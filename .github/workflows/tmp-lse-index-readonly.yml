name: Temporary LSE index data retrieval
on:
  push:
    branches: [tmp-ger40-data]
    paths: ['.github/workflows/tmp-lse-index-readonly.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography requests numpy pandas pyarrow lse-data
      - name: Create ephemeral encryption key and public metadata probe
        run: |
          mkdir -p bootstrap-public discovery market-data
          python - <<'PY'
          import os,json,requests,pathlib
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          key=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          private=pathlib.Path(os.environ['RUNNER_TEMP'])/'lse-ephemeral.pem'
          private.write_bytes(key.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()));private.chmod(0o600)
          pathlib.Path('bootstrap-public/public.pem').write_bytes(key.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          for path in ['meta','catalog']:
              try:
                  r=requests.get('https://api.londonstrategicedge.com/vault/'+path,timeout=45)
                  pathlib.Path('bootstrap-public/public_'+path+'.json').write_text(r.text)
                  print('public',path,r.status_code,len(r.content),flush=True)
              except Exception as e:print('public',path,type(e).__name__,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lse-ephemeral-public-key
          path: bootstrap-public
          retention-days: 1
      - name: Retrieve encrypted credential and inspect data catalog
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/lse_auth.py" <<'PY'
          import os,time,base64,json,pathlib,requests
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          def read_repo(path,wait=900):
              end=time.monotonic()+wait
              while time.monotonic()<end:
                  r=requests.get('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+path,params={'ref':'tmp-ger40-data'},headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN']},timeout=30)
                  if r.status_code==200:return base64.b64decode(r.json()['content'])
                  if r.status_code!=404:r.raise_for_status()
                  time.sleep(6)
              raise TimeoutError('Waiting for research input expired')
          def load_key():
              encrypted=json.loads(read_repo('tmp-lse/sealed-credential.json'))
              k=serialization.load_pem_private_key((pathlib.Path(os.environ['RUNNER_TEMP'])/'lse-ephemeral.pem').read_bytes(),password=None)
              value=k.decrypt(base64.b64decode(encrypted['ciphertext']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
              print('::add-mask::'+value,flush=True)
              return value
          PY
          PYTHONPATH="$RUNNER_TEMP" python - <<'PY'
          from lse_auth import load_key
          import requests,json,pathlib
          key=load_key();headers={'x-api-key':key,'User-Agent':'lse-data-sdk index-research'}
          for path in ['meta','catalog','usage']:
              r=requests.get('https://api.londonstrategicedge.com/vault/'+path,headers=headers,timeout=90)
              text=r.text.replace(key,'[REDACTED]')
              pathlib.Path('discovery/'+path+'.json').write_text(text)
              print('vault',path,r.status_code,len(r.content),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lse-index-discovery
          path: discovery
          retention-days: 1
      - name: Execute bounded market-data retrieval plan
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH="$RUNNER_TEMP" python -u - <<'PY'
          from lse_auth import read_repo,load_key
          import os,pathlib
          code=read_repo('tmp-lse/download.py',wait=1500)
          pathlib.Path('market-data/download.py').write_bytes(code)
          os.environ['LSE_API_KEY']=load_key()
          exec(compile(code,'download.py','exec'),{'__name__':'__main__'})
          os.environ.pop('LSE_API_KEY',None)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lse-index-market-data
          path: market-data
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove ephemeral private key
        if: always()
        run: rm -f "$RUNNER_TEMP/lse-ephemeral.pem" "$RUNNER_TEMP/lse_auth.py"
