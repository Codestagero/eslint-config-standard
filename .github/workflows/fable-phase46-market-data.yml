name: fable-phase46-market-data

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/fable-phase46-market-data.yml'
      - 'tools/collect_phase46_market_data.py'
      - 'tools/phase46_symbols.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fable-phase46-market-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install requests

      - name: Verify frozen inputs and Python compatibility
        run: |
          test -s tools/collect_phase46_market_data.py
          test "$(wc -l < tools/phase46_symbols.txt)" -eq 827
          sha256sum tools/collect_phase46_market_data.py tools/phase46_symbols.txt
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/collect_phase46_market_data.py')
          text = path.read_text()
          text = text.replace('gzip.open(path, "wt", encoding="utf-8", newline="", mtime=0)', 'gzip.open(path, "wt", encoding="utf-8", newline="")')
          path.write_text(text)
          PY
          python -m py_compile tools/collect_phase46_market_data.py

      - name: Collect public market data
        env:
          OUTPUT_ROOT: market_data
          SYMBOLS_FILE: tools/phase46_symbols.txt
          PRICE_WORKERS: '10'
          FUNDING_WORKERS: '8'
          RATE_LIMIT_PAUSE_SECONDS: '70'
        run: python tools/collect_phase46_market_data.py

      - name: Validate artifact
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          root = Path('market_data')
          audit = json.loads((root / 'audit.json').read_text())
          assert audit['panel_symbols'] == 827, audit
          assert audit['current_symbols'] >= 300, audit
          assert audit['recent_price_symbols'] >= 300, audit
          assert audit['price_rows'] >= 5000, audit
          assert audit['funding_rows'] >= 5000, audit
          assert audit['btc_hourly_rows'] >= 72, audit
          assert audit['missing_required_current_prices'] == [], audit
          for name in ('recent_prices.csv.gz', 'recent_funding.csv.gz', 'btc_1h.csv.gz'):
              path = root / name
              assert path.stat().st_size > 100, path
              with gzip.open(path, 'rt') as handle:
                  assert len(handle.readline().strip()) > 0
          print(json.dumps(audit, indent=2))
          PY

      - name: Upload market-data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fable-phase46-market-data-20260821
          path: market_data
          retention-days: 7
          if-no-files-found: warn
