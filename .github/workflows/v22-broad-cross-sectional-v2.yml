name: v22-broad-cross-sectional-v2

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/v22-broad-cross-sectional-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: temporary-v22-broad-cross-sectional-20260823

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn

      - name: Restore and patch frozen runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          p = Path('.github/workflows/v22-broad-cross-sectional.yml')
          lines = p.read_text().splitlines()
          start = lines.index("          base64 -d > /tmp/v22_broad.py.gz <<'V22_BROAD_GZIP_BASE64'") + 1
          end = lines.index('          V22_BROAD_GZIP_BASE64')
          payload = ''.join(x.strip() for x in lines[start:end])
          source = gzip.decompress(base64.b64decode(payload)).decode()
          source = source.replace(
              "corr = hist[names_good].corr(min_periods=80).fillna(0.0).clip(-1.0, 1.0)\n                np.fill_diagonal(corr.values, 1.0)\n                dist = (1.0 - corr).clip(0.0, 2.0)",
              "corr = hist[names_good].corr(min_periods=80).fillna(0.0).clip(-1.0, 1.0)\n                corr_arr = corr.to_numpy(copy=True)\n                np.fill_diagonal(corr_arr, 1.0)\n                corr = pd.DataFrame(corr_arr, index=corr.index, columns=corr.columns)\n                dist = (1.0 - corr).clip(0.0, 2.0)",
          )
          Path('v22_broad.py').write_text(source)
          PY
          python -m py_compile v22_broad.py
          sha256sum v22_broad.py

      - name: Fetch immutable public sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zjplab/US-Trading-Data.git price-data
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/chinobing/historical_sp500_constituents/main/sp_500_historical_components.csv \
            -o sp_500_historical_components.csv
          git -C price-data rev-parse HEAD > PRICE_SOURCE_COMMIT.txt
          sha256sum sp_500_historical_components.csv > MEMBERSHIP_SHA256.txt

      - name: Run V22 broad engine
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python v22_broad.py \
            --price-root price-data \
            --membership sp_500_historical_components.csv \
            --out v22_broad_results 2>&1 | tee v22_broad_run.log
          test -f v22_broad_results/BROAD_STATUS.json

      - name: Persist source and runtime audit
        if: always()
        shell: bash
        run: |
          mkdir -p v22_broad_results
          cp v22_broad.py v22_broad_results/
          cp PRICE_SOURCE_COMMIT.txt MEMBERSHIP_SHA256.txt v22_broad_results/ || true
          { python -V; python -m pip freeze; } > v22_broad_results/runtime.txt
          sha256sum v22_broad_results/* > v22_broad_results/MANIFEST.sha256 || true

      - name: Upload V22 broad artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-broad-cross-sectional-results-v2
          path: |
            v22_broad_results
            v22_broad_run.log
          retention-days: 7
          if-no-files-found: error
