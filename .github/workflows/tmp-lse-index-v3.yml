name: Temporary LSE index data v3
on:
  push:
    branches: [tmp-ger40-data]
    paths: ['.github/workflows/tmp-lse-index-v3.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography requests numpy pandas pyarrow
      - name: Ephemeral key
        run: |
          mkdir -p public-v3 market-data validation-data
          python - <<'PY'
          import os,pathlib
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          k=rsa.generate_private_key(public_exponent=65537,key_size=3072)
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'lse-v3.pem'
          p.write_bytes(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()));p.chmod(0o600)
          pathlib.Path('public-v3/public.pem').write_bytes(k.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lse-public-v3
          path: public-v3
          retention-days: 1
      - name: Read-only candle retrieval
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/lse_auth3.py" <<'PY'
          import os,time,base64,json,pathlib,requests
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          def read_repo(path,wait=1500):
              until=time.monotonic()+wait
              while time.monotonic()<until:
                  r=requests.get('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+path,params={'ref':'tmp-ger40-data'},headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN']},timeout=30)
                  if r.status_code==200:return base64.b64decode(r.json()['content'])
                  if r.status_code!=404:r.raise_for_status()
                  time.sleep(6)
              raise TimeoutError('Research input wait expired')
          def load_key():
              enc=json.loads(read_repo('tmp-lse/sealed-v3.json'))
              k=serialization.load_pem_private_key((pathlib.Path(os.environ['RUNNER_TEMP'])/'lse-v3.pem').read_bytes(),password=None)
              v=k.decrypt(base64.b64decode(enc['ciphertext']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)).decode()
              print('::add-mask::'+v,flush=True);return v
          PY
          PYTHONPATH="$RUNNER_TEMP" python -u - <<'PY'
          from lse_auth3 import read_repo,load_key
          import os,pathlib,numpy as np,pandas as pd
          code=read_repo('tmp-lse/download.py').decode()
          code=code.replace("dates.astype('int64')//1000000 if dates.dtype.unit=='ns' else dates.as_unit('ms').astype('int64')","dates.astype('datetime64[ns, UTC]').astype('int64')//1000000")
          code=code.replace('pd.Timedelta(microseconds=1)','pd.Timedelta(seconds=1)').replace('%Y-%m-%dT%H:%M:%S.%f','%Y-%m-%dT%H:%M:%S')
          # Failures preserve their response body, never authorization headers.
          code=code.replace('r.raise_for_status();return r.json()',"\n        if r.status_code>=400:raise RuntimeError(str(r.status_code)+' '+r.text[:200].replace(KEY,'[REDACTED]'))\n        return r.json()")
          pathlib.Path('market-data/download.py').write_text(code)
          os.environ['LSE_API_KEY']=load_key();exec(compile(code,'download.py','exec'),{'__name__':'__main__'})
          for p in pathlib.Path('market-data').glob('*_1m.parquet'):
              f=pd.read_parquet(p);np.savez_compressed(p.with_suffix('.npz'),**{k:f[k].to_numpy() for k in ['timestamp_ms','open','high','low','close','volume']})
          print('Portable files',len(list(pathlib.Path('market-data').glob('*.npz'))),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lse-all-indices-m1-v3
          path: market-data
          retention-days: 1
          compression-level: 0
      - name: Targeted validation plan
        if: always()
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH="$RUNNER_TEMP" python -u - <<'PY'
          from lse_auth3 import read_repo,load_key
          import os,pathlib
          code=read_repo('tmp-lse/validate_download.py',wait=2100)
          pathlib.Path('validation-data/download.py').write_bytes(code)
          os.environ['LSE_API_KEY']=load_key();exec(compile(code,'validate_download.py','exec'),{'__name__':'__main__'})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lse-index-validation-v3
          path: validation-data
          retention-days: 1
          compression-level: 0
      - name: Remove ephemeral key
        if: always()
        run: rm -f "$RUNNER_TEMP/lse-v3.pem" "$RUNNER_TEMP/lse_auth3.py"
