name: v18-cboe-vol-indices

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/v18-cboe-vol-indices.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download official CBOE volatility-index histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v18_cboe_vol_indices
          BASE='https://cdn.cboe.com/api/global/us_indices/daily_prices'
          for name in VIX_History.csv VIX9D_History.csv VIX3M_History.csv VVIX_History.csv; do
            if curl --fail --location --retry 4 --retry-all-errors "$BASE/$name" -o "v18_cboe_vol_indices/$name"; then
              test "$(wc -l < "v18_cboe_vol_indices/$name")" -gt 1000
            else
              rm -f "v18_cboe_vol_indices/$name"
            fi
          done
          test -s v18_cboe_vol_indices/VIX_History.csv
          sha256sum v18_cboe_vol_indices/* > v18_cboe_vol_indices/MANIFEST.sha256
          printf '%s\n' \
            'source=Cboe official historical data downloads' \
            'base=https://cdn.cboe.com/api/global/us_indices/daily_prices' \
            > v18_cboe_vol_indices/SOURCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: v18-cboe-vol-indices
          path: v18_cboe_vol_indices
          retention-days: 7
          if-no-files-found: error
